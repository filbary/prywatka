<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prywatka – odtwarzacz wbudowany</title>
<style>body{margin:0;background:#15121c;color:#a59cbb;font:12px monospace;padding:6px}</style>
</head>
<body>
<div id="st">ładowanie odtwarzacza…</div>
<script>
// Strona uruchamiana wewnątrz aplikacji Android (WebView). Token i polecenia przychodzą z aplikacji.
const bridge = window.Android || { getToken: () => '', log: m => console.log(m), state: s => console.log('state', s) };
const log = m => { document.getElementById('st').textContent = m; try { bridge.log(m); } catch (e) {} };
let player = null, deviceId = null, ready = false;

async function api(method, path, body) {
  const r = await fetch('https://api.spotify.com/v1' + path, { method,
    headers: { Authorization: 'Bearer ' + bridge.getToken(), 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined });
  const t = await r.text();
  if (!r.ok) throw new Error(r.status + ' ' + t);
  return t ? JSON.parse(t) : null;
}

window.onSpotifyWebPlaybackSDKReady = () => {
  log('SDK załadowane, tworzę odtwarzacz…');
  player = new Spotify.Player({ name: 'Prywatka', getOAuthToken: cb => cb(bridge.getToken()), volume: 1.0 });
  player.addListener('ready', ({ device_id }) => { deviceId = device_id; ready = true; log('Odtwarzacz gotowy ✓ (' + device_id.slice(0, 8) + '…)'); bridge.state('ready'); });
  player.addListener('not_ready', () => { ready = false; log('Odtwarzacz niedostępny'); bridge.state('not_ready'); });
  player.addListener('initialization_error', ({ message }) => { log('Błąd inicjalizacji: ' + message); bridge.state('error'); });
  player.addListener('authentication_error', ({ message }) => { log('Błąd autoryzacji: ' + message); bridge.state('error'); });
  player.addListener('account_error', ({ message }) => { log('Błąd konta: ' + message); bridge.state('error'); });
  player.addListener('playback_error', ({ message }) => log('Błąd odtwarzania: ' + message));
  player.addListener('autoplay_failed', () => log('Przeglądarka zablokowała autoodtwarzanie'));
  player.connect().then(ok => log(ok ? 'Łączenie…' : 'Nie udało się połączyć odtwarzacza'));
};

// wywoływane z aplikacji
window.playTrack = async (id, startSec) => {
  if (!ready) { log('Odtwarzacz jeszcze niegotowy'); return; }
  try {
    await player.activateElement?.();
    await api('PUT', '/me/player/play?device_id=' + deviceId, { uris: ['spotify:track:' + id], position_ms: startSec * 1000 });
    log('Gra od ' + startSec + ' s');
  } catch (e) { log('Błąd play: ' + e.message); }
};
window.pauseTrack = () => { player?.pause().then(() => log('Pauza')); };
window.resumeTrack = () => { player?.resume().then(() => log('Wznowiono')); };
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
