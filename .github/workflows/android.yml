name: Android – test APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Zbuduj APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Pokaz odcisk certyfikatu (SHA1)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i sha-1

      - name: Przygotuj plik
        run: cp android/app/build/outputs/apk/debug/app-debug.apk prywatka-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prywatka-test-apk
          path: prywatka-test.apk

      - name: Opublikuj w Releases (link do pobrania na telefonie)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Prywatka – test Android
          prerelease: true
          body: "Testowa wersja na Androida. Pobierz prywatka-test.apk na telefonie i zainstaluj."
          files: prywatka-test.apk
