<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prywatka">
<title>Prywatka</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <b>Prywatka</b>
  <span id="pstate" class="pill">ładowanie…</span>
</header>

<!-- start -->
<section id="vHome" class="view" hidden>
  <button id="scanBtn" class="big">📷 Skanuj kartę</button>
  <p class="hint">Masz YouTube Premium? Zaloguj się na youtube.com w tej przeglądarce – wtedy nie będzie reklam.</p>
  <details class="tools">
    <summary>Narzędzia testowe</summary>
    <form id="manualForm" class="row">
      <input id="manual" placeholder="PRYWATKA2;ID;sekunda" autocomplete="off">
      <button>Graj</button>
    </form>
    <form id="linkForm" class="row">
      <input id="link" placeholder="Link YouTube" autocomplete="off">
      <input id="linkSec" type="number" min="0" value="60" aria-label="Start w sekundach" style="max-width:80px">
      <button>QR</button>
    </form>
    <div id="qrBox" hidden><div id="qrImg"></div><code id="qrTxt"></code></div>
    <label class="row">Długość fragmentu
      <select id="lenSel"><option>20</option><option selected>30</option><option>45</option><option>60</option></select> s</label>
    <h3>Dziennik</h3>
    <ol id="log"></ol>
  </details>
</section>

<!-- skaner -->
<section id="vScan" class="view" hidden>
  <div class="cam"><video id="video" playsinline muted></video><div class="frame"></div></div>
  <p id="scanMsg" class="hint">Skieruj aparat na kod QR karty.</p>
  <button id="scanCancel" class="ghost">Anuluj</button>
</section>

<!-- odtwarzanie -->
<section id="vPlay" class="view" hidden>
  <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="bg"/><circle id="arc" cx="60" cy="60" r="54" class="fg"/></svg><div id="count">…</div></div>
  <p id="playMsg" class="hint">Ładuję…</p>
  <div class="grid">
    <button id="againBtn">↺ Powtórz</button>
    <button id="moreBtn">+15 s</button>
    <button id="pauseBtn">⏸ Pauza</button>
    <button id="revealBtn">👁 Odkryj</button>
  </div>
  <div id="reveal" hidden></div>
  <button id="nextBtn" class="big">📷 Następna karta</button>
</section>

<!-- ukryty odtwarzacz YouTube (zasłonięty planszą) -->
<div class="player"><div id="yt"></div><div class="cover">🎵</div></div>

<div id="toast" hidden></div>
<script src="vendor/jsQR.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
